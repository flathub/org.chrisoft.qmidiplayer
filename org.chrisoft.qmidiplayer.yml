id: org.chrisoft.qmidiplayer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: qmidiplayer
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --filesystem=home
  - --device=dri
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
modules:
  # Visualization
  - name: glfw
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DGLFW_BUILD_EXAMPLES=OFF
      - -DGLFW_BUILD_TESTS=OFF
      - -DGLFW_BUILD_DOCS=OFF
    sources:
      - type: archive
        url: https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip
        sha256: b5ec004b2712fd08e8861dc271428f048775200a2df719ccf575143ba749a3e9

  - shared-modules/glew/glew.json
  - shared-modules/glu/glu-9.json
  # Minimum QMidiPlayer build
  - shared-modules/linux-audio/fluidsynth2.json

  - name: rtmidi
    buildsystem: cmake-ninja
    cleanup:
      - /share/rtmidi
    sources:
      - type: archive
        url: https://github.com/thestk/rtmidi/archive/refs/tags/6.1.0.tar.gz
        sha256: 809ce56bfa67b80afcfa566927ce242a60b6f4c1bacc7e89486fbcf5624c5721
        x-checker-data:
          type: anitya
          project-id: 4220
          url-template: https://github.com/thestk/rtmidi/archive/refs/tags/$version.tar.gz

  - name: qmidiplayer
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_VISUALIZATION=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DUSE_QT6=ON
    post-install:
      - desktop-file-edit --set-key=Exec --set-value=qmidiplayer /app/share/applications/${FLATPAK_ID}.desktop
    cleanup:
      - /share/qmidiplayer/doc
      - /share/qmidiplayer/img
    sources:
      - type: git
        url: https://github.com/chirs241097/QMidiPlayer.git
        tag: '0.8.10'
        commit: 9f0fafdb2129bc5320f81c4fb9439b0e5a2ad80a
        x-checker-data:
          is-main-source: true
          type: git
      - type: patch
        path: appstream.diff
